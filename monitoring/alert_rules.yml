groups:
  - name: shortener_alerts
    rules:
      - alert: ShortenerDown
        expr: up{job="shortener"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "URL shortener is unreachable"
          description: "Prometheus cannot scrape /metrics from the shortener for 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(flask_http_request_total{status=~"5.."}[2m]))
            /
            sum(rate(flask_http_request_total[2m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are failing with 5xx over the last 2 minutes."
