upstream shortener {
    # max_fails/fail_timeout: eject a backend from the pool after 2 failed
    # attempts and retry it 10s later. This is what lets the service degrade
    # to the surviving instance instead of erroring when one app dies.
    server app1:5000 max_fails=2 fail_timeout=10s;
    server app2:5000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;

    location / {
        proxy_pass http://shortener;

        # Reuse upstream connections instead of a new TCP handshake per request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The header set Flask's deployment docs ask for, so ProxyFix can
        # recover the real client address and scheme behind the proxy.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /;

        # Retry the other upstream if one is down mid-request.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;

        add_header X-Upstream-Addr $upstream_addr always;
    }
}
